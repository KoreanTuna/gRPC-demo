name: grpc_study
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # 디버깅용 로거
  logger: ^2.6.0

  # 라우트
  go_router: ^15.1.3

  # 의존성 주입
  get_it: ^8.2.0
  injectable: ^2.5.1
  injectable_generator: ^2.7.0

  # 데이터 모델링
  freezed: ^3.2.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  equatable: ^2.0.7

  # 내장 스토리지
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # 객체 관리를 위한 uuid생성
  uuid: ^4.5.1

  # HTTP 유틸 지원
  http_parser: ^4.1.2
  crypto: ^3.0.3

  # gRPC
  grpc: ^4.1.0
  protobuf: ^4.2.0
  protoc_plugin: ^22.5.0

  meta: ^1.16.0
  talker_grpc_logger: ^5.0.0
  talker_flutter: ^5.0.0
  async: ^2.13.0
  flutter_hooks: ^0.21.3+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Lint 지원
  flutter_lints: ^5.0.0
  custom_lint: 0.8.0

  # 데이터 직렬화
  json_serializable: ^6.11.1

  # Source Gen
  build_runner: ^2.6.0

  # GoRouter Source Gen
  go_router_builder: ^4.1.0

flutter:
  uses-material-design: true

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/PretendardVariable.ttf
    - family: Jalnan
      fonts:
        - asset: assets/fonts/Jalnan2TTF.ttf
    - family: JalnanGothic
      fonts:
        - asset: assets/fonts/JalnanGothicTTF.ttf
